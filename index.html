<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Turni</title>
    <style>
        /* STILI ISPIRATI ALLO SCREENSHOT (Minimal, Teal/Sage Green) */
        :root {
            --primary-color: #5F9EA0; /* Colore verde acqua/salvia */
            --text-main: #333333;
            --text-light: #666666;
            --bg-page: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .document-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Linee decorative in alto e in basso */
        .deco-lines {
            height: 12px;
            background-color: #d1e0e0;
            margin-bottom: 8px;
            width: 100%;
        }
        .deco-lines.thin { height: 6px; }

        h1 {
            color: var(--primary-color);
            text-transform: uppercase;
            font-size: 2.2em;
            letter-spacing: 2px;
            margin-top: 30px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.9em;
            margin-bottom: 40px;
        }

        /* Sezione di Caricamento e Filtri */
        .controls-section {
            background-color: #f9fbfb;
            border: 1px dashed var(--primary-color);
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 5px;
        }

        .controls-section button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .controls-section button:hover { background-color: #4f8587; }

        /* Stile Agenda per i Dati */
        .agenda-item {
            margin-bottom: 30px;
        }

        .riunione-badge {
            display:block;background:#e8f4f8;color:#2471a3;
            border:1px solid #aed6f1;border-radius:4px;
            font-size:0.80em;padding:2px 9px;margin:0 0 8px;font-weight:600;
        }
        .input-time-edit {
            width:110px;padding:2px 4px;font-size:0.88em;
            border:1px solid #ccc;border-radius:3px;margin-left:4px;
        }
        .month-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            color: #fff;
            background: var(--primary-color);
            border-radius: 6px;
            padding: 8px 20px;
            margin: 30px 0 20px;
            letter-spacing: 0.06em;
        }

        .agenda-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .day-label {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.05em;
            white-space: nowrap;
        }

        .day-separator {
            flex: 1;
            height: 1px;
            background-color: #d1e0e0;
            display: block;
        }

        .agenda-content {
            margin-left: 15px;
            padding-left: 0;
            line-height: 1.8;
        }

        .shift-row {
            list-style-type: none;
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.95em;
            padding: 3px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .shift-name {
            width: 90px;
            font-weight: bold;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .shift-op {
            width: 55px;
            font-weight: bold;
            color: var(--text-main);
            flex-shrink: 0;
        }

        .shift-time {
            color: var(--text-light);
            font-size: 0.9em;
        }

        /* Classi per evidenziare turni */
        .shift-row.highlight {
            background-color: #e8f4f4;
            border-left: 3px solid var(--primary-color);
        }

        .shift-row.highlight-warning {
            background-color: #fff8e1;
            border-left: 3px solid #f0a500;
        }

        /* Tasto modifica turno */
        .btn-modifica {
            background: none;
            border: 1px solid #c5dada;
            border-radius: 3px;
            color: var(--primary-color);
            font-size: 0.78em;
            padding: 2px 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-modifica:hover { background: #e8f4f4; }
        .btn-modifica.salva {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }
        .btn-modifica.salva:hover { background: #4f8587; }
        .select-op-edit {
            padding: 2px 4px;
            border: 1px solid var(--primary-color);
            border-radius: 3px;
            font-size: 0.93em;
            font-weight: bold;
            color: var(--text-main);
            background: #fff;
            width: 70px;
        }

        /* Giorno di oggi e domani */
        .agenda-item.today {
            background: #f1f8f1;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 30px;
        }
        .agenda-item.today .day-label { color: #2e7d32; }
        .agenda-item.tomorrow {
            background: #fffde7;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 30px;
        }
        .agenda-item.tomorrow .day-label { color: #e65100; }

        /* Layout lista + gantt */
        .agenda-body {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .agenda-body .agenda-content { flex: 1; }

        /* Gantt verticale */
        .gantt-day { flex-shrink: 0; width: 130px; }
        .gantt-label {
            font-size: 0.65em;
            color: var(--text-light);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }
        .gantt-timeline {
            position: relative;
            height: 300px;
            background: #f8fbfb;
            border: 1px solid #ddeaea;
            border-radius: 4px;
            overflow: hidden;
        }
        .gantt-tick-line {
            position: absolute;
            left: 22px; right: 0;
            height: 1px;
            background: #e4eeee;
            pointer-events: none;
        }
        .gantt-tick {
            position: absolute;
            left: 1px; width: 19px;
            font-size: 0.57em;
            color: #bbb;
            text-align: right;
            transform: translateY(-50%);
            line-height: 1;
            pointer-events: none;
        }
        .gantt-bar {
            position: absolute;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58em;
            font-weight: bold;
            color: rgba(255,255,255,0.93);
            overflow: hidden;
            cursor: default;
            min-height: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        @media (max-width: 600px) {
            .gantt-day { width: 90px; }
            .gantt-timeline { height: 216px; }
            .gantt-bar { font-size: 0.5em; }
            .gantt-tick { font-size: 0.52em; width: 17px; }
            .gantt-tick-line { left: 20px; }
        }

        /* Pannello impostazioni collassabile */
        .settings-toggle {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.88em;
            cursor: pointer;
            padding: 0;
            text-decoration: underline dotted;
        }
        .settings-panel { display: none; }
        .settings-panel.open { display: block; }

        /* Select filtro operatore */
        #filterSelect {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.93em;
            min-width: 220px;
            background: #fff;
            cursor: pointer;
            color: var(--text-main);
        }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .document-container {
                padding: 16px 14px;
                box-shadow: none;
            }
            h1 {
                font-size: 1.5em;
                letter-spacing: 1px;
                margin-top: 14px;
            }
            .subtitle {
                margin-bottom: 20px;
            }
            .controls-section {
                padding: 12px 10px;
                margin-bottom: 24px;
            }
            #filterSelect {
                width: 100%;
                min-width: unset;
            }
            .agenda-content {
                margin-left: 0;
            }
            .shift-name {
                width: 68px;
                font-size: 0.88em;
            }
            .shift-op {
                width: 44px;
            }
            .shift-time {
                font-size: 0.82em;
            }
            .agenda-item.today,
            .agenda-item.tomorrow {
                padding: 8px 6px;
            }
            .footer-info {
                margin-top: 30px;
            }
        }

        /* Box riepilogo ore operatore */
        #ore-riepilogo {
            display: none;
            background: #f0f7f7;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 16px 20px;
            margin-top: 30px;
            font-size: 0.93em;
        }
        #ore-riepilogo h4 {
            margin: 0 0 12px;
            color: var(--primary-color);
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ore-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
        }
        .ore-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #d1e0e0;
            padding: 3px 0;
        }
        .ore-turno { color: var(--text-light); }
        .ore-valore { font-weight: bold; color: var(--text-main); }
        .ore-totale {
            margin-top: 12px;
            font-size: 1.05em;
            font-weight: bold;
            color: var(--primary-color);
            text-align: right;
            border-top: 2px solid var(--primary-color);
            padding-top: 8px;
        }
        @media (max-width: 600px) {
            .ore-grid { grid-template-columns: 1fr; }
            #ore-riepilogo { padding: 12px 10px; }
        }

        /* Footer */
        .footer-info {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 0.85em;
            color: var(--text-light);
        }
        .footer-info span { margin-bottom: 5px; }
    </style>
</head>

        function setStatus(msg) {
            document.getElementById('status-text').innerHTML = `<strong>Stato:</strong> ${msg}`;
        }

        function parseShift(shift) {
            // Supporta sia oggetti strutturati che stringhe legacy "NOME: OP (time)"
            if (typeof shift === 'object') return shift;
            const match = shift.match(/^(.+?):\s*([^\s(]+)(?:\s*\(([^)]+)\))?$/);
            if (match) return { name: match[1].trim(), op: match[2].trim(), time: match[3] || '' };
            return { name: shift, op: '', time: '' };
        }

        const MESI_IT = {
            'gennaio':1,'febbraio':2,'marzo':3,'aprile':4,'maggio':5,'giugno':6,
            'luglio':7,'agosto':8,'settembre':9,'ottobre':10,'novembre':11,'dicembre':12
        };

        function getMeseOrder(mese) {
            if (!mese) return 999999;
            const p = mese.split('_');
            if (p.length < 2) return 999999;
            const m = MESI_IT[p[0].toLowerCase()] || 99;
            const y = parseInt(p[1]) || 9999;
            return y * 100 + m;
        }

        function getMeseDisplayLabel(mese) {
            if (!mese) return '';
            const p = mese.split('_');
            if (p.length < 2) return mese.toUpperCase();
            return p[0].toUpperCase() + ' ' + p[1];
        }

        function inferMese(dayLabel) {
            if (!dayLabel) return null;
            const m = dayLabel.match(/\d+\s+(\w+)/i);
            if (!m) return null;
            const nome = m[1].toLowerCase();
            if (!MESI_IT[nome]) return null;
            return `${nome}_${new Date().getFullYear()}`;
        }

        function dayKey(d) {
            const m = d.mese || inferMese(d.dayLabel);
            return `${m}_${d.id}`;
        }

        function getDayClass(label) {
            const m = label.match(/(\d+)\s+(\w+)/);
            if (!m) return '';
            const giorno = parseInt(m[1]);
            const mese = MESI_IT[m[2].toLowerCase()];
            if (!mese) return '';
            const oggi = new Date();
            const anno = oggi.getFullYear();
            const d = new Date(anno, mese - 1, giorno);
            const dataOggi  = new Date(anno, oggi.getMonth(), oggi.getDate());
            const dataDomani = new Date(anno, oggi.getMonth(), oggi.getDate() + 1);
            if (d.getTime() === dataOggi.getTime())  return 'today';
            if (d.getTime() === dataDomani.getTime()) return 'tomorrow';
            return '';
        }

        function populateOperatorSelect() {
            const select = document.getElementById('filterSelect');
            const prev = select.value;
            const ops = new Set();
            turniData.forEach(day => {
                (day.shifts || []).forEach(rawShift => {
                    const s = parseShift(rawShift);
                    if (s.op) ops.add(s.op.toUpperCase());
                });
            });
            select.innerHTML = '<option value="">👥 Tutti gli operatori</option>';
            [...ops].sort().forEach(op => {
                const opt = document.createElement('option');
                opt.value = op.toLowerCase();
                opt.textContent = op;
                select.appendChild(opt);
            });
            if (prev) select.value = prev;
        }

            const btn   = document.querySelector('.settings-toggle');
            panel.classList.toggle('open');
            btn.textContent = panel.classList.contains('open') ? '⚙ Impostazioni ▴' : '⚙ Impostazioni ▾';
        }

        function buildGantt(dayData) {
            const TOTAL = 1440;
            const TICKS = [0, 4, 8, 12, 16, 20, 24];
            const COLORS = {
                'NOTTE 2': '#2c4b8a', 'MATT 1':  '#e8921a',
                'MATT 2':  '#f5b731', 'CENTR.':  '#4caf7d',
                'POM 1':   '#5f9ea0', 'POM 2':   '#8b72be',
                'NOTTE 1': '#1a2f5e'
            };
            // Area orizontale: 27.3% tick label, 69.3% barre, 1.2% gap tra lane
            const TICK_L = 27.3;
            const BAR_W  = 69.3;
            const GAP    = 1.2;

            // 1. Parsing
            const bars = [];
            (dayData.shifts || []).forEach(rawShift => {
                const s = parseShift(rawShift);
                const m = s.time ? s.time.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/) : null;
                if (!m) return;
                let startMin = parseInt(m[1]) * 60 + parseInt(m[2]);
                let endMin   = parseInt(m[3]) * 60 + parseInt(m[4]);
                if (endMin === 0) endMin = 1440;
                bars.push({ startMin, endMin, name: s.name, op: s.op, time: s.time,
                            color: COLORS[s.name] || '#5f9ea0' });
            });
            bars.sort((a, b) => a.startMin - b.startMin);

            // 2. Assegna lane con greedy algorithm
            const laneEnds = [];
            bars.forEach(bar => {
                let lane = laneEnds.findIndex(end => end <= bar.startMin);
                if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
                laneEnds[lane] = bar.endMin;
                bar.lane = lane;
            });

            // 3. Calcola quante lane sono attive nello stesso intervallo per ogni barra
            bars.forEach(bar => {
                const concurrent = bars.filter(b => b.startMin < bar.endMin && b.endMin > bar.startMin);
                bar.totalLanes = Math.max(...concurrent.map(b => b.lane)) + 1;
            });

            // 4. Tick
            const ticksHtml = TICKS.map(h => {
                const pct = (h * 60 / TOTAL * 100).toFixed(2);
                return `<div class="gantt-tick-line" style="top:${pct}%"></div>
                        <div class="gantt-tick" style="top:${pct}%">${h}</div>`;
            }).join('');

            // 5. Barre affiancate per le sovrapposizioni
            const barsHtml = bars.map(bar => {
                const top    = (bar.startMin / TOTAL * 100).toFixed(2);
                const height = ((bar.endMin - bar.startMin) / TOTAL * 100).toFixed(2);
                const laneW  = (BAR_W - GAP * (bar.totalLanes - 1)) / bar.totalLanes;
                const left   = (TICK_L + bar.lane * (laneW + GAP)).toFixed(2);
                const lbl    = parseFloat(height) > 4 ? bar.op : '';
                return `<div class="gantt-bar"
                            style="top:${top}%;height:${height}%;left:${left}%;width:${laneW.toFixed(2)}%;background:${bar.color}"
                            title="${bar.name} \u2014 ${bar.op} (${bar.time})">${lbl}</div>`;
            }).join('');

            return `<div class="gantt-day">
                        <div class="gantt-label">orari</div>
                        <div class="gantt-timeline">${ticksHtml}${barsHtml}</div>
                    </div>`;
        }

        function renderAgenda(dataToRender) {
            const container = document.getElementById('agenda-content-area');
            container.innerHTML = '';
            document.getElementById('agenda-subtitle').innerText = "Mese di competenza: " + turniMeseLabel;

            if (dataToRender.length === 0) {
                container.innerHTML = '<p style="color:var(--text-light); font-style:italic;">Nessun dato trovato. Carica un PDF per iniziare.</p>';
                return;
            }

            let lastMese = null;
            dataToRender.forEach((dayData) => {
                const label = dayData.dayLabel || dayData.day || `Giorno ${dayData.id}`;
                const dayClass = getDayClass(label);
                const meseDayData = dayData.mese || inferMese(label);
                if (meseDayData && meseDayData !== lastMese) {
                    container.innerHTML += `<div class="month-header">${getMeseDisplayLabel(meseDayData)}</div>`;
                    lastMese = meseDayData;
                }
                const rb = dayData.riunione ? '<div class="riunione-badge">📋 Riunione d\'&eacute;quipe</div>' : '';
                let html = `
                    <div class="agenda-item ${dayClass}" data-dayid="${dayData.id}" data-mese="${dayData.mese || ''}">
                        <div class="agenda-title">
                            <span class="day-separator"></span>
                            <span class="day-label">${label}</span>
                            <span class="day-separator"></span>
                            <button class="btn-modifica" onclick="toggleModificaGiorno(this)">✏ modifica</button>
                        </div>
                        ${rb}
                        <div class="agenda-body">
                        <ul class="agenda-content">
                `;
                (dayData.shifts || []).forEach((rawShift, idx) => {
                    const s = parseShift(rawShift);
                    html += `
                        <li class="shift-row" data-shiftidx="${idx}" data-turno="${s.name}" data-op="${s.op}">
                            <span class="shift-name">${s.name}</span>
                            <span class="shift-op-display">${s.op}</span>
                            <span class="shift-time">${s.time ? '(' + s.time + ')' : ''}</span>
                        </li>`;
                });
                html += `</ul>${buildGantt(dayData)}</div></div>`;
                container.innerHTML += html;
            });
        }

        // Raccoglie tutti gli operatori noti da turniData
        function getOperatoriKnown() {
            const ops = new Set();
            turniData.forEach(day => {
                (day.shifts || []).forEach(rawShift => {
                    const s = parseShift(rawShift);
                    if (s.op) ops.add(s.op.toUpperCase());
                });
            });
            return [...ops].sort();
        }

        window.toggleModificaGiorno = async function(btn) {
            const agendaItem = btn.closest('.agenda-item');
            const dayId = parseInt(agendaItem.dataset.dayid);
            const dayMese = agendaItem.dataset.mese || null;
            const righe = agendaItem.querySelectorAll('li.shift-row');
            const ops = getOperatoriKnown();

            if (btn.classList.contains('salva')) {
                // ── SALVA operatori, orari e riunione ──
                const dayObj = turniData.find(d => d.id === dayId && (!dayMese || d.mese === dayMese));

                const chk = agendaItem.querySelector('.check-riunione');
                if (chk && dayObj) dayObj.riunione = chk.checked;
                const reRow = agendaItem.querySelector('.riunione-edit-row');
                if (reRow) reRow.remove();
                const bodyDiv = agendaItem.querySelector('.agenda-body');
                const oldBadge = bodyDiv.querySelector('.riunione-badge');
                if (oldBadge) oldBadge.remove();
                if (dayObj && dayObj.riunione) {
                    const badge = document.createElement('div');
                    badge.className = 'riunione-badge';
                    badge.textContent = '📋 Riunione d\'équipe';
                    bodyDiv.insertBefore(badge, bodyDiv.firstChild);
                }

                righe.forEach(li => {
                    const idx = parseInt(li.dataset.shiftidx);
                    const sel = li.querySelector('.select-op-edit');
                    if (!sel) return;
                    const nuovoOp = sel.value;
                    const timeInp = li.querySelector('.input-time-edit');
                    const nuovoTime = timeInp ? timeInp.value.trim() : null;

                    if (dayObj) {
                        const s = parseShift(dayObj.shifts[idx]);
                        s.op = nuovoOp;
                        if (nuovoTime !== null) s.time = nuovoTime;
                        dayObj.shifts[idx] = s;
                    }

                    const sp = document.createElement('span');
                    sp.className = 'shift-op-display';
                    sp.textContent = nuovoOp;
                    sel.replaceWith(sp);
                    if (timeInp) {
                        const tsp = document.createElement('span');
                        tsp.className = 'shift-time';
                        tsp.textContent = nuovoTime ? '(' + nuovoTime + ')' : '';
                        timeInp.replaceWith(tsp);
                    }
                });

                btn.classList.remove('salva');
                btn.textContent = '✏ modifica';

                // Salva su Firebase
                setStatus('Salvataggio giorno in corso...');
                try {
                    const snap = await getDocs(collection(db, 'turni'));
                    for (const docSnap of snap.docs) {
                        const dd = docSnap.data();
                        if (dd.id === dayId && (!dayMese || dd.mese === dayMese)) {
                            const dayObj2 = turniData.find(x => x.id === dayId && (!dayMese || x.mese === dayMese));
                            await updateDoc(doc(db, 'turni', docSnap.id), { shifts: dayObj2.shifts, riunione: !!dayObj2.riunione });
                            break;
                        }
                    }
                    setStatus(`✅ Giorno aggiornato (id ${dayId})`);
                    populateOperatorSelect();
                } catch(e) {
                    console.error(e);
                    setStatus('❌ Errore nel salvataggio.');
                }

            } else {
                // ── MODIFICA: trasforma tutti gli operatori in select ──
                righe.forEach(li => {
                    const opDisplay = li.querySelector('.shift-op-display');
                    if (!opDisplay) return;
                    const currentOp = opDisplay.textContent.trim().toUpperCase();

                    const sel = document.createElement('select');
                    sel.className = 'select-op-edit';
                    ops.forEach(op => {
                        const opt = document.createElement('option');
                        opt.value = op;
                        opt.textContent = op;
                        if (op === currentOp) opt.selected = true;
                        sel.appendChild(opt);
                    });
                    opDisplay.replaceWith(sel);
                    const ts = li.querySelector('.shift-time');
                    if (ts) {
                        const inp = document.createElement('input');
                        inp.type='text'; inp.className='input-time-edit';
                        inp.value = ts.textContent.replace(/[()]/g,'').trim();
                        inp.placeholder='es. 8:30 - 14:00';
                        ts.replaceWith(inp);
                    }
                });
                const curR = !!(turniData.find(d => d.id === dayId && (!dayMese || d.mese === dayMese)) || {}).riunione;
                const reRow = document.createElement('div');
                reRow.className = 'riunione-edit-row';
                reRow.style.cssText = 'margin:0 0 8px;font-size:0.85em;color:#555';
                reRow.innerHTML = `<label><input type="checkbox" class="check-riunione"${
                    curR ? ' checked' : ''}> 📋 Riunione d&apos;&eacute;quipe</label>`;
                const ulEl = agendaItem.querySelector('ul.agenda-content');
                ulEl.parentNode.insertBefore(reRow, ulEl);

                btn.classList.add('salva');
                btn.textContent = '💾 salva';
            }
        }

        window.svuotaMeseCorrente = async function() {
            if (!lastElaboratedMese) {
                alert('Nessun mese selezionato. Elabora prima un PDF.');
                return;
            }
            const label = getMeseDisplayLabel(lastElaboratedMese);
            if (!confirm(`Eliminare tutti i dati di ${label} dal database?`)) return;
            setStatus('Svuotamento mese in corso...');
            try {
                const snapshot = await getDocs(collection(db, "turni"));
                for (const docSnap of snapshot.docs) {
                    const d = docSnap.data();
                    const dm = d.mese || inferMese(d.dayLabel);
                    if (dm === lastElaboratedMese) await deleteDoc(doc(db, "turni", docSnap.id));
                }
                turniData = turniData.filter(d => (d.mese || inferMese(d.dayLabel)) !== lastElaboratedMese);
                renderAgenda(turniData);
                setStatus(`${label} rimosso dal database ✅`);
            } catch (error) {
                console.error("Errore svuotamento mese:", error);
                setStatus('Errore nello svuotamento ❌');
            }
        }

        window.svuotaCollection = async function() {
            if (!confirm('Sei sicuro di voler svuotare tutti i dati dal database?')) return;
            setStatus('Svuotamento database in corso...');
            try {
                const snapshot = await getDocs(collection(db, "turni"));
                for (const docSnap of snapshot.docs) {
                    await deleteDoc(doc(db, "turni", docSnap.id));
                }
                turniData = [];
                renderAgenda([]);
                setStatus('Database svuotato ✅');
            } catch (error) {
                console.error("Errore svuotamento:", error);
                setStatus('Errore nello svuotamento ❌');
            }
        }

        // Carica i dati da Firebase all'apertura della pagina
        async function loadFromFirebase() {
            setStatus('Caricamento dal database in corso...');
            try {
                const snapshot = await getDocs(collection(db, "turni"));
                if (snapshot.empty) {
                    setStatus('Nessun dato nel database. Carica un PDF.');
                    renderAgenda([]);
                    return;
                }
                turniData = [];
                snapshot.forEach(docSnap => {
                    turniData.push({ _docId: docSnap.id, ...docSnap.data() });
                });
                // Aggiunge il campo mese ai documenti Firebase che non ce l'hanno
                turniData.forEach(d => { if (!d.mese) d.mese = inferMese(d.dayLabel); });
                // Riempie i giorni mancanti da turniDataMock (chiave: mese + id)
                const fbKeys = new Set(turniData.map(dayKey));
                turniDataMock.forEach(mock => {
                    if (!fbKeys.has(dayKey(mock))) turniData.push(mock);
                });
                // Ordina per mese poi per id
                turniData.sort((a, b) => {
                    const ma = getMeseOrder(a.mese), mb = getMeseOrder(b.mese);
                    if (ma !== mb) return ma - mb;
                    return (a.id || 0) - (b.id || 0);
                });
                // Aggiorna label con tutti i mesi presenti
                const mesiPresenti = [...new Set(turniData.map(d => d.mese).filter(Boolean))];
                mesiPresenti.sort((a, b) => getMeseOrder(a) - getMeseOrder(b));
                if (mesiPresenti.length > 0) turniMeseLabel = mesiPresenti.map(getMeseDisplayLabel).join(' — ');
                renderAgenda(turniData);
                populateOperatorSelect();
                scrollToToday();
                const mancanti = turniDataMock.length - fbKeys.size;
                setStatus(mancanti > 0
                    ? `Sincronizzato con Firebase ✅ (${mancanti} giorni integrati da dati locali)`
                    : 'Sincronizzato con Firebase ✅');
            } catch (error) {
                console.error("Errore lettura Firebase:", error);
                setStatus('Errore di connessione al database ❌');
            }
        }

        // Controlla se il server locale è attivo
        async function checkServer() {
            try {
                const r = await fetch('http://localhost:8080/api/status', { signal: AbortSignal.timeout(800) });
                if (r.ok) {
                    document.getElementById('server-hint').innerHTML =
                        '🟢 Server locale attivo — puoi importare il PDF.';
                }
            } catch {
                document.getElementById('server-hint').innerHTML =
                        '🔴 Server locale non attivo. Avvia <strong>server.py</strong> per importare un PDF.';
            }
        }
        checkServer();

        // Elabora PDF tramite server locale e aggiorna turniData
        window.elaboraPdf = async function() {
            const pdfName = document.getElementById('pdfFileName').value.trim();
            if (!pdfName) { alert('Inserisci il nome del file PDF.'); return; }
            setStatus('Elaborazione PDF in corso...');
            try {
                const res = await fetch('http://localhost:8080/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pdfName })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Errore sconosciuto');
                if (result.jsonFile) {
                    const parts = result.jsonFile.replace('.json', '').split('_');
                    lastElaboratedMese = parts.length >= 3 ? `${parts[1]}_${parts[2]}` : null;
                }
                // Aggiunge il campo mese a ogni giorno del PDF elaborato
                const newDays = result.data.map(d => ({ ...d, mese: lastElaboratedMese }));
                // Fonde con i dati esistenti: mantieni altri mesi, sostituisci quello corrente
                turniData = turniData.filter(d => (d.mese || inferMese(d.dayLabel)) !== lastElaboratedMese)
                                     .concat(newDays);
                turniData.sort((a, b) => {
                    const ma = getMeseOrder(a.mese), mb = getMeseOrder(b.mese);
                    if (ma !== mb) return ma - mb;
                    return (a.id || 0) - (b.id || 0);
                });
                turniDataMock = [...turniData];
                // Aggiorna label con tutti i mesi presenti
                const mesiEl = [...new Set(turniData.map(d => d.mese).filter(Boolean))];
                mesiEl.sort((a, b) => getMeseOrder(a) - getMeseOrder(b));
                turniMeseLabel = mesiEl.length > 0 ? mesiEl.map(getMeseDisplayLabel).join(' — ') : '';
                renderAgenda(turniData);
                populateOperatorSelect();
                setStatus(`✅ PDF elaborato: ${result.giorni} giorni. Clicca "Salva su Firebase" per sincronizzare.`);
            } catch (error) {
                if (error.name === 'TypeError' || error.name === 'AbortError') {
                    setStatus('❌ Server locale non raggiungibile. Avvia server.py.');
                } else {
                    setStatus(`❌ ${error.message}`);
                }
            }
        }

        // Salva i dati correnti (turniData) su Firebase
        window.salvaFirebase = async function() {
            // Usa turniData (aggiornato da elaboraPdf) oppure turniDataMock come fallback
            const datiDaSalvare = (turniData && turniData.length > 0) ? turniData : turniDataMock;
            if (datiDaSalvare.length === 0) {
                alert('Nessun dato disponibile.');
                return;
            }
            setStatus('Salvataggio su Firebase in corso...');
            try {
                const existing = await getDocs(collection(db, 'turni'));
                for (const docSnap of existing.docs) {
                    await deleteDoc(doc(db, 'turni', docSnap.id));
                }
                for (const turno of datiDaSalvare) {
                    const { _docId, ...dati } = turno;
                    if (!dati.mese) dati.mese = inferMese(dati.dayLabel);
                    await addDoc(collection(db, 'turni'), dati);
                }
                await loadFromFirebase();
                setStatus('✅ Sincronizzato con Firebase.');
            } catch (error) {
                console.error('Errore Firebase:', error);
                setStatus('❌ Errore nel salvataggio su Firebase.');
            }
        }

        function parseMinuti(timeStr) {
            // Accetta formati: "8:30 - 14:00" oppure "8:30 - 14:00"
            if (!timeStr) return 0;
            const m = timeStr.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
            if (!m) return 0;
            const start = parseInt(m[1]) * 60 + parseInt(m[2]);
            let   end   = parseInt(m[3]) * 60 + parseInt(m[4]);
            if (end === 0) end = 24 * 60; // mezzanotte = fine turno
            return Math.max(0, end - start);
        }

        function aggiornaRiepilogoOre(query, filteredData) {
            const box = document.getElementById('ore-riepilogo');
            if (!query) { box.style.display = 'none'; return; }

            // Accumula minuti per tipo di turno
            const perTurno = {};
            let totMin = 0;
            filteredData.forEach(day => {
                (day.shifts || []).forEach(rawShift => {
                    const s = parseShift(rawShift);
                    const min = parseMinuti(s.time);
                    perTurno[s.name] = (perTurno[s.name] || 0) + min;
                    totMin += min;
                });
            });

            const fmt = m => `${Math.floor(m/60)}h ${m%60 > 0 ? (m%60)+'m' : ''}`.trim();

            document.getElementById('ore-op-nome').textContent = query.toUpperCase();
            const grid = document.getElementById('ore-grid');
            grid.innerHTML = Object.entries(perTurno)
                .sort((a,b) => b[1]-a[1])
                .map(([nome, min]) => `
                    <div class="ore-row">
                        <span class="ore-turno">${nome}</span>
                        <span class="ore-valore">${fmt(min)}</span>
                    </div>`).join('');
            document.getElementById('ore-totale').textContent = `Totale: ${fmt(totMin)} (${filteredData.length} giorni)`;
            box.style.display = 'block';
        }

        window.applyFilter = function() {
            const query = document.getElementById('filterSelect').value.toLowerCase();
            if (!query) {
                renderAgenda(turniData);
                document.getElementById('ore-riepilogo').style.display = 'none';
                return;
            }
            const filteredData = turniData.map(dayInfo => {
                const filteredShifts = (dayInfo.shifts || []).filter(rawShift => {
                    const s = parseShift(rawShift);
                    return s.op.toLowerCase() === query;
                });
                return { ...dayInfo, shifts: filteredShifts };
            }).filter(dayInfo => dayInfo.shifts.length > 0);
            renderAgenda(filteredData);
            aggiornaRiepilogoOre(query, filteredData);
        }

        // Carica i dati all'apertura
        loadFromFirebase();
    </script>
</body>
